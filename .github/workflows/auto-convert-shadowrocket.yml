name: Auto Convert INI to Shadowrocket CONF

on:
  push:
    branches: [main]
    paths:
      - 'subconverter/advanced.ini'
      - 'scripts/ini2conf.py'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run INI to CONF Script
        run: python3 scripts/ini2conf.py

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: auto-convert advanced.ini to Shadowrocket CONF [skip ci]"
          file_pattern: "Shadowrocket/config/ACL4ALL_Advanced.conf"
          skip_fetch: false
          skip_checkout: false
